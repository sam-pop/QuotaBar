name: QuotaBar
options:
  bundleIdPrefix: com.sam
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "26.3"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
targets:
  QuotaBar:
    type: application
    platform: macOS
    sources:
      - QuotaBar
    settings:
      base:
        INFOPLIST_FILE: QuotaBar/Info.plist
        CODE_SIGN_ENTITLEMENTS: QuotaBar/QuotaBar.entitlements
        CODE_SIGN_IDENTITY: "-"
        # Historical identifier: renaming it would orphan existing installs' credentials/registration.
        PRODUCT_BUNDLE_IDENTIFIER: com.sam.ClaudeUsageBar
        MARKETING_VERSION: "1.5.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  QuotaBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: QuotaBarTests
      - path: QuotaBar
        excludes: ["QuotaBarApp.swift"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.sam.ClaudeUsageBarTests
schemes:
  QuotaBar:
    build:
      targets:
        QuotaBar: all
        QuotaBarTests: [test]
    test:
      targets: [QuotaBarTests]
